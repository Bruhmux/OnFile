[package]
name = "crypts_and_clues"
version = "0.1.0"
edition = "2024"

[dependencies]
async-scoped = { version = "0.9.0", features = ["use-tokio"] }
axum = { version = "0.8.8", features = ["json"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
dotenvy = { version = "0.15.7", features = ["cli", "clap"] }
rand = { version = "0.10.0", features = ["thread_rng", "std"] }
rustyline = { version = "18.0.0", features = ["with-file-history"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
